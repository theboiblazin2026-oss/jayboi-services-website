<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal Login | Jayboi Services</title>
    <meta name="description"
        content="Login to your Jayboi Services Client Portal to access driver files, compliance documents, and service requests.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Login styles moved to style.css -->
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N2NFX78MXW"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-N2NFX78MXW');
    </script>
    <link rel="icon" type="image/png" href="./logo-transparent.png">
</head>

<body class="login-body">
    <div class="login-card">
        <div class="login-header">
            <h1 class="visually-hidden">Client Login</h1>
            <h2 class="text-accent">Client Portal</h2>
            <p>Access your driver files and requests</p>
        </div>

        <div id="error-message" class="error-msg"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="driver@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <div class="text-right-sm">
                <a href="#" id="forgot-password" class="text-gray-sm-link">Forgot
                    Password?</a>
            </div>
            <button type="submit" class="btn btn-primary w-full">Log In</button>
        </form>
        <div class="login-footer-link">
            <a href="index.html" class="text-gray-sm">Back to Home</a>
        </div>
    </div>

    <script type="module">
        import { auth } from './js/firebase-config.js';
        import { signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-message');
        const forgotPasswordLink = document.getElementById('forgot-password');

        forgotPasswordLink.addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            if (!email) {
                errorMsg.textContent = "Please enter your email address first.";
                errorMsg.style.display = 'block';
                return;
            }
            try {
                await sendPasswordResetEmail(auth, email);
                errorMsg.textContent = "Password reset email sent! Check your inbox.";
                errorMsg.style.color = "green"; // Temporary style change for success
                errorMsg.style.display = 'block';
            } catch (error) {
                console.error(error);
                errorMsg.textContent = "Error: " + error.message;
                errorMsg.style.color = "#ff6b6b";
                errorMsg.style.display = 'block';
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            errorMsg.style.display = 'none';
            errorMsg.style.color = "#ff6b6b"; // Reset color

            try {
                // In a real app, we might check a 'role' claim here to ensure they are a client/driver
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'driver-portal.html';
            } catch (error) {
                console.error(error);
                if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                    errorMsg.textContent = "Invalid email or password.";
                } else {
                    errorMsg.textContent = "Login Failed: " + error.message;
                }
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
