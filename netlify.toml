# Netlify Configuration for Jayboi Services

# Build settings
[build]
  publish = "."
  command = "echo 'Static site - no build needed'"

# Security Headers - Apply to all pages
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking attacks
    X-Frame-Options = "DENY"
    
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    
    # Enable XSS protection
    X-XSS-Protection = "1; mode=block"
    
    # Referrer policy for privacy
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Permissions policy - restrict sensitive APIs
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    
    # Content Security Policy - Protect against XSS and injection attacks
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.googletagmanager.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.cloudfunctions.net wss://*.firebaseio.com https://formspree.io; frame-src 'self' https://*.firebaseapp.com;"

# Force HTTPS
[[redirects]]
  from = "http://jayboiservicesllc.com/*"
  to = "https://jayboiservicesllc.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.jayboiservicesllc.com/*"
  to = "https://jayboiservicesllc.com/:splat"
  status = 301
  force = true
